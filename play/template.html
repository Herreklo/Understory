<!doctype html>
<!-- The play page's template. src/tools/play.ts puts the sets in place of the marker below and writes dist/play.html. One file, no server. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Twelve months in town</title>
<style>
:root { --bg: #ece9e1; --paper: #faf8f3; --ink: #1d1f24; --ink2: #5e626c; --rule: rgba(29,31,36,.14); --accent: #2d49a8; --good: #2b7650; --bad: #a73434; --chip: rgba(29,31,36,.06);
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif; --sans: "Helvetica Neue", Helvetica, Arial, sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #121417; --paper: #1a1e24; --ink: #e6e5df; --ink2: #9aa0a8; --rule: rgba(230,229,223,.14); --accent: #96aaff; --good: #6ec79b; --bad: #e27474; --chip: rgba(230,229,223,.07); } }
:root[data-theme="dark"] { --bg: #121417; --paper: #1a1e24; --ink: #e6e5df; --ink2: #9aa0a8; --rule: rgba(230,229,223,.14); --accent: #96aaff; --good: #6ec79b; --bad: #e27474; --chip: rgba(230,229,223,.07); }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 17px; line-height: 1.45; }
.app { max-width: 620px; margin: 0 auto; padding: 20px 16px 48px; min-height: 100dvh; display: flex; flex-direction: column; gap: 14px; }
.bar { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 12px; white-space: nowrap; color: var(--ink2); letter-spacing: .04em; text-transform: uppercase; }
.bar b { color: var(--ink); }
.card { background: var(--paper); border: 1px solid var(--rule); border-radius: 14px; padding: 22px 20px; }
h1 { font-family: var(--serif); font-weight: 600; font-size: 34px; line-height: 1.1; margin: 0 0 10px; letter-spacing: -.01em; }
h2 { font-family: var(--serif); font-weight: 600; font-size: 24px; line-height: 1.2; margin: 0 0 8px; }
h3 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); margin: 18px 0 6px; font-weight: 600; }
p { margin: 0 0 10px; }
.prose { font-family: var(--serif); font-size: 19px; line-height: 1.5; }
.muted { color: var(--ink2); }
.small { font-size: 14px; }
ul { margin: 0; padding-left: 20px; } li { margin: 4px 0; }
button { font: inherit; color: inherit; cursor: pointer; }
.btn { display: block; width: 100%; text-align: left; background: var(--paper); border: 1.5px solid var(--rule); border-radius: 12px; padding: 14px 16px; margin: 8px 0; font-size: 17px; line-height: 1.35; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); text-align: center; font-weight: 600; }
.btn.chosen { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.btn.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 10%, var(--paper)); }
.btn.wrong { border-color: var(--bad); }
.btn.quiet { color: var(--ink2); border-style: dashed; text-align: center; font-size: 15px; }
.btn:disabled { cursor: default; opacity: .9; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row .btn { width: auto; flex: 1 1 60px; text-align: center; padding: 12px 8px; }
.tally { display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; font-size: 15px; }
.tally b { font-size: 20px; font-family: var(--serif); }
.verdict { font-family: var(--serif); font-size: 22px; margin: 6px 0 2px; }
.verdict.good { color: var(--good); } .verdict.bad { color: var(--bad); }
details { border-top: 1px solid var(--rule); margin-top: 14px; padding-top: 8px; }
summary { cursor: pointer; font-weight: 600; padding: 8px 0; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary::before { content: "+ "; color: var(--accent); } details[open] summary::before { content: "– "; }
.when { font-size: 13px; color: var(--ink2); letter-spacing: .04em; text-transform: uppercase; margin-bottom: 6px; }
.fade { animation: fade .25s ease-out; } @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.chip { display: inline-block; background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 13px; margin: 2px 4px 2px 0; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const SETS = /*__SETS__*/null;
const MON = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const app = document.getElementById('app');
let setIx = 0, S, ix, score, picked, state;
const show = html => { app.innerHTML = `<div class="fade">${html}</div>`; window.scrollTo(0, 0); };
const bar = (left, right) => `<div class="bar"><span>${left}</span><span>${right}</span></div>`;

function start(i) {
  setIx = i % SETS.length; S = SETS[setIx]; ix = 0; picked = {};
  score = { you: 0, town: 0, witness: 0, byPerson: {} };
  for (const p of S.people) score.byPerson[p.name] = { right: 0, n: 0 };
  title();
}
function title() {
  show(`${bar('Twelve months in town', `${S.cards.length} months`)}
  <div class="card">
    <h1>Twelve months in town</h1>
    <p class="prose">You have just moved to ${esc(S.town)}. You work at ${esc(S.you.job)}. Over the next year, ${S.people.length} people you get to know will each face a few moments where it is not obvious what they will do.</p>
    <p class="prose">Each month: read what you know about one of them, bet on what they do, then see what happened and why.</p>
    <p class="small muted">You are scored against the town (what most people here do in that spot) and against the witness, a reader inside the model that has watched them longer than you have. Nothing you do is saved.</p>
    <button class="btn primary" onclick="meet(0)">Meet them</button>
  </div>`);
}
function personCard(p, full) {
  return `<h2>${esc(p.name)}, ${p.age}</h2><p class="muted">${esc(p.job)}${p.facts && p.facts.length ? ' · ' + esc(p.facts.join(', ')) : ''}</p>
    ${p.how ? `<p class="prose">${esc(p.how)}</p>` : ''}`;
}
function meet(i) {
  const p = S.people[i];
  const c = S.cards.find(c => c.person.name === p.name);
  show(`${bar(`Meeting ${i + 1} of ${S.people.length}`, esc(S.town))}
  <div class="card">
    ${personCard(p)}
    ${c.page.sense.length ? `<h3>Your first sense of them</h3><ul>${c.page.sense.slice(0, 3).map(s => `<li>${esc(s)}</li>`).join('')}</ul>` : ''}
    ${c.page.seen.length ? `<h3>Things you have seen them do</h3><ul>${c.page.seen.slice(0, 3).map(s => `<li>${esc(s)}</li>`).join('')}</ul>` : ''}
    <button class="btn primary" onclick="${i + 1 < S.people.length ? `meet(${i + 1})` : 'card()'}">${i + 1 < S.people.length ? 'Next' : 'Start the year'}</button>
  </div>`);
}
function pageOf(c) {
  const g = c.page;
  return `<details><summary>Read up on ${esc(c.person.first)} (what you know by now)</summary>
    ${personCard(c.person)}
    ${g.sense.length ? `<h3>Your sense of them</h3><ul>${g.sense.map(s => `<li>${esc(s)}</li>`).join('')}</ul>` : ''}
    ${g.seems ? `<p class="small muted">${esc(g.seems)}</p>` : ''}
    ${g.seen.length ? `<h3>What you have seen them do</h3><ul>${g.seen.map(s => `<li>${esc(s)}</li>`).join('')}</ul>` : ''}
    ${g.known.length ? `<h3>What you have seen and heard</h3><ul class="small">${g.known.slice(-8).map(k => `<li><span class="muted">${k.year}</span> ${esc(k.text)}</li>`).join('')}</ul>` : ''}
    ${c.other ? `<h3>${esc(c.other.name)}, ${c.other.age}, ${esc(c.other.job)}</h3><p class="small">${esc(c.other.tie)}${c.other.feel.length ? ' ' + esc(c.other.feel.join(' ')) : ''}</p>
      ${c.other.between.length ? `<ul class="small">${c.other.between.slice(-4).map(k => `<li><span class="muted">${k.year}</span> ${esc(k.text)}</li>`).join('')}</ul>` : ''}` : ''}
  </details>`;
}
function card() {
  const c = S.cards[ix]; state = 'ask';
  show(`${bar(`${MON[c.t % 12]} ${c.year} · ${ix + 1}/${S.cards.length}`, `You ${score.you} · town ${score.town} · witness ${score.witness}`)}
  <div class="card">
    <div class="when">${esc(c.person.name)}</div>
    <p class="prose">${esc(c.question)}</p>
    ${c.other ? `<p class="small muted">${esc(c.other.name)}, ${c.other.age}, ${esc(c.other.job)}. ${esc(c.other.tie)}</p>` : ''}
    ${c.town ? `<p class="small muted">${esc(c.town)}</p>` : ''}
    <h3>What does ${esc(c.person.first)} do?</h3>
    <div id="opts">${c.options.map(o => `<button class="btn" onclick="pick('${o.id}')">${esc(o.text)}</button>`).join('')}</div>
    ${pageOf(c)}
  </div>`);
}
function pick(id) {
  if (state !== 'ask') return; state = 'told';
  const c = S.cards[ix]; picked[ix] = id;
  const right = id === c.answer, town = c.readers.base === c.answer, wit = c.readers.witness === c.answer;
  if (right) score.you++; if (town) score.town++; if (wit) score.witness++;
  const bp = score.byPerson[c.person.name]; bp.n++; if (right) bp.right++;
  const opts = document.getElementById('opts');
  for (const b of opts.querySelectorAll('button')) {
    b.disabled = true;
    const oid = b.getAttribute('onclick').match(/'([^']+)'/)[1];
    if (oid === c.answer) b.classList.add('right'); else if (oid === id) b.classList.add('wrong');
  }
  const seen = { you: right, town, wit };
  const line = who => who ? '<span style="color:var(--good)">right</span>' : '<span style="color:var(--bad)">wrong</span>';
  opts.insertAdjacentHTML('afterend', `<div class="fade">
    <p class="verdict ${right ? 'good' : 'bad'}">${right ? 'You read ' + esc(c.person.first) + ' right.' : 'Not this time.'}</p>
    <h3>What happened</h3><p class="prose">${esc(c.happened)}</p>
    ${c.why && c.why.length ? `<h3>Why, as the record has it</h3><ul>${c.why.map(w => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}
    <p class="small muted" style="margin-top:12px">You: ${line(seen.you)} · the town: ${line(seen.town)} · the witness: ${line(seen.wit)}</p>
    <button class="btn primary" onclick="next()">${ix + 1 < S.cards.length ? 'Next month' : 'The year is over'}</button>
  </div>`);
}
function next() { ix++; if (ix < S.cards.length) card(); else end(); }
function end() {
  const n = S.cards.length;
  const per = S.people.map(p => { const b = score.byPerson[p.name]; return `<li><b>${esc(p.first)}</b>: you read ${b.right} of ${b.n}${b.right === b.n ? ', every time' : b.right === 0 ? ', never' : ''}.</li>`; }).join('');
  const beat = score.you > score.town ? `You beat the town by ${score.you - score.town}.` : score.you === score.town ? 'You matched the town.' : `The town beat you by ${score.town - score.you}.`;
  const vs = score.you > score.witness ? 'You beat the witness.' : score.you === score.witness ? 'You matched the witness.' : 'The witness, which has watched them longer, did better.';
  show(`${bar('The year is over', esc(S.town))}
  <div class="card">
    <h1>${score.you} of ${n}</h1>
    <p class="prose">${beat} ${vs}</p>
    <div class="tally"><span>You</span><b>${score.you}</b><span>The town's usual answer</span><b>${score.town}</b><span>The witness</span><b>${score.witness}</b></div>
    <h3>Who you read</h3><ul>${per}</ul>
    <h3>Did they feel like people?</h3>
    <div class="row" id="felt">${[1,2,3,4,5].map(k => `<button class="btn" onclick="felt(${k})">${k}</button>`).join('')}</div>
    <p class="small muted">1 is "a list of acts", 5 is "I could tell you who they are". This is not saved; it is for you.</p>
    <button class="btn primary" onclick="start(${setIx + 1})">Another town, other people</button>
    <button class="btn quiet" onclick="start(${setIx})">Play these people again</button>
  </div>`);
}
function felt(k) { const r = document.getElementById('felt'); for (const b of r.querySelectorAll('button')) { b.disabled = true; b.classList.toggle('chosen', +b.textContent === k); } }
if (!SETS || !SETS.length) app.innerHTML = '<div class="card"><p>No sets were built into this page.</p></div>'; else start(0);
</script>
</body>
</html>
