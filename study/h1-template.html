<!doctype html>
<!-- H1's pair page (study/h1.md). study/h1-build.mjs puts the pairs in place of the marker in the script and writes dist/h1.html:
     one file, no server, nothing fetched. A reader reads two versions of a life, picks the one they would rather read on, may mark
     lines, and at the end (or at any point) copies a block of answers to send back. Progress is kept on the device only. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Two versions of a life</title>
<style>
:root { --bg: #ece9e1; --paper: #faf8f3; --ink: #1d1f24; --ink2: #5e626c; --rule: rgba(29,31,36,.14); --accent: #2d49a8; --false: #a73434; --rep: #8a6a12; --felt: #2b7650; --chip: rgba(29,31,36,.06);
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif; --sans: "Helvetica Neue", Helvetica, Arial, sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #121417; --paper: #1a1e24; --ink: #e6e5df; --ink2: #9aa0a8; --rule: rgba(230,229,223,.14); --accent: #96aaff; --false: #e27474; --rep: #d9b45a; --felt: #6ec79b; --chip: rgba(230,229,223,.07); } }
:root[data-theme="dark"] { --bg: #121417; --paper: #1a1e24; --ink: #e6e5df; --ink2: #9aa0a8; --rule: rgba(230,229,223,.14); --accent: #96aaff; --false: #e27474; --rep: #d9b45a; --felt: #6ec79b; --chip: rgba(230,229,223,.07); }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 17px; line-height: 1.45; }
.app { max-width: 720px; margin: 0 auto; padding: 14px 16px 48px; min-height: 100dvh; display: flex; flex-direction: column; gap: 12px; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 12px; color: var(--ink2); letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; }
.bar button { background: none; border: 0; padding: 4px 0; color: var(--accent); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; }
.card { background: var(--paper); border: 1px solid var(--rule); border-radius: 14px; padding: 20px 18px; }
@media (max-width: 480px) { .app { padding: 10px 10px 40px; } .card { padding: 16px 10px; } }
h1 { font-family: var(--serif); font-weight: 600; font-size: 30px; line-height: 1.1; margin: 0 0 10px; }
h2 { font-family: var(--serif); font-weight: 600; font-size: 21px; line-height: 1.2; margin: 0 0 6px; }
h3 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); margin: 18px 0 6px; font-weight: 600; }
p { margin: 0 0 10px; }
.prose { font-family: var(--serif); font-size: 18px; line-height: 1.5; }
.muted { color: var(--ink2); } .small { font-size: 14px; }
button { font: inherit; color: inherit; cursor: pointer; }
.btn { display: block; width: 100%; text-align: center; background: var(--paper); border: 1.5px solid var(--rule); border-radius: 12px; padding: 13px 14px; margin: 8px 0; font-size: 16px; line-height: 1.3; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
.btn.chosen { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.row { display: flex; gap: 8px; } .row .btn { flex: 1; }
.tabs { position: sticky; top: 0; z-index: 2; display: flex; gap: 6px; padding: 8px 0; background: var(--bg); }
.tabs button { flex: 1; padding: 10px 6px; border-radius: 10px; border: 1.5px solid var(--rule); background: var(--paper); font-size: 15px; font-weight: 600; }
.tabs button.on { border-color: var(--accent); color: var(--accent); }
.tabs .n { font-weight: 400; color: var(--ink2); font-size: 13px; }
.head { font-family: var(--serif); font-size: 19px; margin: 2px 0 10px; }
.lines { list-style: none; margin: 0; padding: 0; }
.ln { display: grid; grid-template-columns: 1.7em 1fr; gap: 0 6px; padding: 6px 4px; border-bottom: 1px solid var(--rule); cursor: pointer; border-radius: 6px; }
.ln:hover { background: var(--chip); }
.ln .no { font-size: 12px; color: var(--ink2); text-align: right; padding-top: 3px; font-variant-numeric: tabular-nums; }
.ln .y { font-size: 13px; color: var(--ink2); font-variant-numeric: tabular-nums; margin-right: 4px; }
.ln .t { font-family: var(--serif); font-size: 17px; }
.ln .why { display: block; font-size: 13.5px; color: var(--ink2); margin-top: 2px; }
.ln .cited { display: block; font-size: 13px; color: var(--ink2); margin: 2px 0 0 10px; }
.ln.m-false { box-shadow: inset 3px 0 0 var(--false); } .ln.m-repeat { box-shadow: inset 3px 0 0 var(--rep); } .ln.m-felt { box-shadow: inset 3px 0 0 var(--felt); }
.ln.open { background: var(--chip); }
.tag { display: inline-block; font-size: 12px; border-radius: 6px; padding: 1px 6px; margin: 4px 4px 0 0; border: 1px solid currentColor; }
.tag.false { color: var(--false); } .tag.repeat { color: var(--rep); } .tag.felt { color: var(--felt); }
.act { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; cursor: default; }
.act button { padding: 7px 10px; border-radius: 8px; border: 1.5px solid var(--rule); background: var(--paper); font-size: 14px; }
.act button.false { border-color: var(--false); } .act button.repeat { border-color: var(--rep); } .act button.felt { border-color: var(--felt); }
.act .fl { display: flex; gap: 6px; width: 100%; }
.act input { flex: 1; min-width: 0; }
.tally { font-size: 13px; color: var(--ink2); margin: 10px 0 0; }
textarea { width: 100%; min-height: 160px; font: 13px/1.4 ui-monospace, Menlo, monospace; color: var(--ink); background: var(--chip); border: 1px solid var(--rule); border-radius: 8px; padding: 10px; }
input[type=text] { font: inherit; font-size: 16px; width: 100%; padding: 9px 11px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); color: var(--ink); }
.fade { animation: fade .2s ease-out; } @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const DATA = /*__PAIRS__*/null;
const MAX_MARKS = 3, MAX_FELT = 2; // a version's lines that ring false or repeat, and its lines that show a feeling
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const app = document.getElementById('app');
const show = html => { app.innerHTML = `<div class="fade">${html}</div>`; window.scrollTo(0, 0); };
const STORE = DATA ? `h1-${DATA.page}` : 'h1';
let S = null; // {reader, started, ix, pairs: {H01: {prefer, ms, seen: {A, B}, marks: {A: {line: kind}, B}, felt: {A: {line: [what, toward]}, B}}}}
const load = () => { try { return JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) { return null; } };
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {} };
const blank = () => ({ prefer: null, ms: 0, seen: { A: false, B: false }, marks: { A: {}, B: {} }, felt: { A: {}, B: {} } });
const answered = () => DATA.pairs.filter(p => S.pairs[p.id]?.prefer).length;

function intro() {
  const old = load();
  show(`<div class="card">
    <h1>Two versions of a life</h1>
    <p class="prose">Each pair is one person's last ten years in a small town, written twice. The two versions come from slightly different towns, so things go differently. Read both, and choose the one you would rather go on reading.</p>
    <p class="prose">If a line rings false, or repeats what you have already read, you can tap it and mark it (up to three in each version). If a line lets you tell what the person felt, and toward whom, you can mark that too (up to two). Both are optional; the choice is what matters.</p>
    <p class="small muted">There are ${DATA.pairs.length} pairs, and the pages are long: a pair is about 4,000 words, ten to fifteen minutes read with care. Nobody is expected to do them all at once: every four pairs is a good place to stop. This device remembers where you are, and you can send what you have at any point, from the top of the page. Nothing is sent by the page itself.</p>
    <h3>Your name or initials</h3>
    <input type="text" id="who" maxlength="40" autocomplete="off" value="${esc(old?.reader ?? '')}">
    ${old ? `<button class="btn primary" onclick="resume()">Go on from pair ${Math.min(old.ix + 1, DATA.pairs.length)}</button><button class="btn" onclick="begin(true)">Start again</button>`
          : `<button class="btn primary" onclick="begin(false)">Begin</button>`}
  </div>`);
}
function who() { return (document.getElementById('who')?.value || '').trim(); }
function begin(again) {
  if (!who()) { document.getElementById('who').focus(); return; }
  if (again && !confirm('Start again? The answers on this device will be cleared.')) return;
  S = { reader: who(), started: new Date().toISOString(), ix: 0, pairs: {} }; save(); pair();
}
function resume() { S = load(); if (who()) S.reader = who(); save(); S.ix >= DATA.pairs.length ? finish() : pair(); }

let view = 'A', openLine = null, t0 = null;
function tick() { if (t0 != null && S && S.ix < DATA.pairs.length) { const a = cur(); a.ms += Date.now() - t0; t0 = Date.now(); save(); } }
document.addEventListener('visibilitychange', () => { if (document.hidden) { tick(); t0 = null; } else if (S && S.ix < DATA.pairs.length && document.getElementById('pair')) t0 = Date.now(); });
function cur() { const id = DATA.pairs[S.ix].id; return (S.pairs[id] ??= blank()); }
function pair() { view = 'A'; openLine = null; t0 = Date.now(); render(); window.scrollTo(0, 0); }
function counts(a, v) { const m = Object.values(a.marks[v]).length, f = Object.keys(a.felt[v]).length; return { m, f }; }
function render() {
  const p = DATA.pairs[S.ix], a = cur(), V = p[view];
  a.seen[view] = true; save();
  const lines = V.lines.map((l, i) => {
    const n = i + 1, mk = a.marks[view][n], fe = a.felt[view][n];
    const cls = ['ln', mk ? `m-${mk}` : fe ? 'm-felt' : '', openLine === n ? 'open' : ''].join(' ');
    const tags = `${mk ? `<span class="tag ${mk}">${mk === 'false' ? 'rings false' : 'repeats'}</span>` : ''}${fe ? `<span class="tag felt">felt${fe[0] ? ': ' + esc(fe[0]) : ''}${fe[1] ? ' → ' + esc(fe[1]) : ''}</span>` : ''}`;
    return `<li class="${cls}" data-n="${n}" onclick="tap(event, ${n})"><span class="no">${n}</span><span><span class="y">${l.y}</span><span class="t">${esc(l.t)}</span>${l.why ? `<span class="why">[${esc(l.why)}]</span>` : ''}${l.cited.map(c => `<span class="cited">↳ ${esc(c)}</span>`).join('')}${tags ? `<span style="display:block">${tags}</span>` : ''}</span>${openLine === n ? actions(a, n) : ''}</li>`;
  }).join('');
  const c = counts(a, view), both = a.seen.A && a.seen.B;
  app.innerHTML = `<div id="pair">
    <div class="bar"><span>Pair ${S.ix + 1} of ${DATA.pairs.length}</span><span><button onclick="${S.ix ? 'back()' : 'intro()'}">Back</button> · <button onclick="finish()">Send answers</button></span></div>
    <div class="tabs"><button class="${view === 'A' ? 'on' : ''}" onclick="go('A')">Version A <span class="n">${p.A.lines.length} lines</span></button><button class="${view === 'B' ? 'on' : ''}" onclick="go('B')">Version B <span class="n">${p.B.lines.length} lines</span></button></div>
    <div class="card">
      <div class="head">${esc(V.head)}</div>
      <ul class="lines">${lines}</ul>
      <p class="tally">Version ${view}: ${c.m} of ${MAX_MARKS} lines marked as false or repeating, ${c.f} of ${MAX_FELT} as showing a feeling. Tap a line to mark it.</p>
      ${view === 'A' && !a.seen.B ? `<button class="btn primary" onclick="go('B')">Read version B</button>` : ''}
      ${both ? `<h3>Which would you rather read on?</h3>
        <div class="row" id="pick"><button class="btn ${a.prefer === 'A' ? 'chosen' : ''}" onclick="pick('A')">Version A</button><button class="btn ${a.prefer === 'B' ? 'chosen' : ''}" onclick="pick('B')">Version B</button></div>
        <button class="btn primary" id="next" onclick="next()" ${a.prefer ? '' : 'disabled'}>${S.ix + 1 < DATA.pairs.length ? 'Next pair' : 'Finish'}</button>` : view === 'B' ? '<p class="small muted">Open version A too before you choose.</p>' : ''}
    </div></div>`;
}
function actions(a, n) {
  const c = counts(a, view), mk = a.marks[view][n], fe = a.felt[view][n];
  const full = !mk && c.m >= MAX_MARKS, ffull = !fe && c.f >= MAX_FELT;
  return `<div class="act" onclick="event.stopPropagation()">
    <button class="false" onclick="mark(${n}, 'false')" ${full ? 'disabled' : ''}>${mk === 'false' ? '✓ ' : ''}Rings false</button>
    <button class="repeat" onclick="mark(${n}, 'repeat')" ${full ? 'disabled' : ''}>${mk === 'repeat' ? '✓ ' : ''}Repeats</button>
    <button class="felt" onclick="feel(${n})" ${ffull ? 'disabled' : ''}>${fe ? '✓ ' : ''}Shows what they felt</button>
    ${mk || fe ? `<button onclick="clearLine(${n})">Clear</button>` : ''}
    ${fe ? `<div class="fl"><input type="text" id="fw" maxlength="60" placeholder="what they felt" value="${esc(fe[0])}" oninput="feelText(${n})"><input type="text" id="ft" maxlength="60" placeholder="toward whom" value="${esc(fe[1])}" oninput="feelText(${n})"></div>` : ''}
  </div>`;
}
function keep(fn) { const y = window.scrollY; fn(); save(); render(); window.scrollTo(0, y); }
function tap(ev, n) { keep(() => { openLine = openLine === n ? null : n; }); }
function mark(n, k) { keep(() => { const m = cur().marks[view]; if (m[n] === k) delete m[n]; else m[n] = k; }); }
function feel(n) { keep(() => { const f = cur().felt[view]; if (f[n]) delete f[n]; else f[n] = ['', '']; }); if (cur().felt[view][n]) document.getElementById('fw')?.focus({ preventScroll: true }); }
function feelText(n) { cur().felt[view][n] = [document.getElementById('fw').value, document.getElementById('ft').value]; save(); }
function clearLine(n) { keep(() => { delete cur().marks[view][n]; delete cur().felt[view][n]; }); }
function go(v) { tick(); view = v; openLine = null; render(); document.querySelector('.tabs')?.scrollIntoView(); window.scrollTo(0, 0); }
function pick(v) { cur().prefer = v; save(); for (const b of document.querySelectorAll('#pick .btn')) b.classList.toggle('chosen', b.textContent.endsWith(v)); document.getElementById('next').disabled = false; }
function next() { tick(); t0 = null; S.ix++; save(); S.ix < DATA.pairs.length ? pair() : finish(); }
function back() { tick(); t0 = null; S.ix = Math.max(0, S.ix - 1); save(); pair(); }

// The block to send: one line of text a person can paste into a message; study/h1-score.py reads it.
function block() {
  const pairs = {};
  for (const p of DATA.pairs) {
    const a = S.pairs[p.id]; if (!a || !(a.prefer || a.seen.A || a.seen.B)) continue;
    const list = v => Object.entries(a.marks[v]).map(([n, k]) => [+n, k]);
    const felt = v => Object.entries(a.felt[v]).map(([n, f]) => [+n, f[0].trim(), f[1].trim()]);
    pairs[p.id] = { prefer: a.prefer, s: Math.round(a.ms / 1000), marks: { A: list('A'), B: list('B') }, felt: { A: felt('A'), B: felt('B') } };
  }
  return JSON.stringify({ study: 'H1', page: DATA.page, reader: S.reader, started: S.started, sent: new Date().toISOString(), answered: answered(), of: DATA.pairs.length, pairs });
}
function finish() {
  tick(); t0 = null;
  const done = answered(), rest = DATA.pairs.length - done;
  show(`<div class="bar"><span>${done} of ${DATA.pairs.length} pairs answered</span><span>${S.ix < DATA.pairs.length ? `<button onclick="pair()">Back to pair ${S.ix + 1}</button>` : ''}</span></div>
  <div class="card">
    <h2>${rest ? 'Send what you have' : 'Thank you'}</h2>
    <p>Copy the text below and send it to the person who gave you the page, in a message or an email, or save it as a file and send that. It holds your answers and the name you gave, nothing else.${rest ? ` You can come back for the other ${rest} later on this device and send again; the later block includes everything.` : ''}</p>
    <textarea id="out" readonly>${esc(block())}</textarea>
    <button class="btn primary" onclick="copyOut()">Copy</button>
    <button class="btn" onclick="saveOut()">Save as a file</button>
    <p class="small muted" id="copied"></p>
  </div>`);
}
function copyOut() { const t = document.getElementById('out'); t.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} try { navigator.clipboard.writeText(t.value).then(() => { document.getElementById('copied').textContent = 'Copied.'; }, () => {}); } catch (e) {} if (ok) document.getElementById('copied').textContent = 'Copied.'; }
function saveOut() { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([document.getElementById('out').value], { type: 'text/plain' })); a.download = `h1-${(S.reader || 'reader').replace(/[^\w-]+/g, '_')}.txt`; a.click(); }
window.__h1 = { block, get S() { return S; } };
if (!DATA || !DATA.pairs.length) app.innerHTML = '<div class="card"><p>No pairs were built into this page.</p></div>'; else intro();
</script>
</body>
</html>
