<!doctype html>
<!-- The human study's page (round Q3; docs/study.md). study/build.mjs puts the items in place of the marker in the script and writes dist/study.html:
     one file, no server. A tester meets the town, answers 24 items (half with the person's page, half without), sees the reveal after each,
     and at the end copies or saves their answers to send back. Nothing leaves the page on its own. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reading the town</title>
<style>
:root { --bg: #ece9e1; --paper: #faf8f3; --ink: #1d1f24; --ink2: #5e626c; --rule: rgba(29,31,36,.14); --accent: #2d49a8; --good: #2b7650; --bad: #a73434; --chip: rgba(29,31,36,.06);
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif; --sans: "Helvetica Neue", Helvetica, Arial, sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #121417; --paper: #1a1e24; --ink: #e6e5df; --ink2: #9aa0a8; --rule: rgba(230,229,223,.14); --accent: #96aaff; --good: #6ec79b; --bad: #e27474; --chip: rgba(230,229,223,.07); } }
:root[data-theme="dark"] { --bg: #121417; --paper: #1a1e24; --ink: #e6e5df; --ink2: #9aa0a8; --rule: rgba(230,229,223,.14); --accent: #96aaff; --good: #6ec79b; --bad: #e27474; --chip: rgba(230,229,223,.07); }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 17px; line-height: 1.45; }
.app { max-width: 640px; margin: 0 auto; padding: 18px 16px 48px; min-height: 100dvh; display: flex; flex-direction: column; gap: 12px; }
.bar { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--ink2); letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; }
.card { background: var(--paper); border: 1px solid var(--rule); border-radius: 14px; padding: 22px 20px; }
h1 { font-family: var(--serif); font-weight: 600; font-size: 32px; line-height: 1.1; margin: 0 0 10px; }
h2 { font-family: var(--serif); font-weight: 600; font-size: 22px; line-height: 1.2; margin: 0 0 8px; }
h3 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); margin: 18px 0 6px; font-weight: 600; }
p { margin: 0 0 10px; } ul { margin: 0; padding-left: 20px; } li { margin: 4px 0; }
.prose { font-family: var(--serif); font-size: 19px; line-height: 1.5; }
.muted { color: var(--ink2); } .small { font-size: 14px; }
button { font: inherit; color: inherit; cursor: pointer; }
.btn { display: block; width: 100%; text-align: left; background: var(--paper); border: 1.5px solid var(--rule); border-radius: 12px; padding: 14px 16px; margin: 8px 0; font-size: 17px; line-height: 1.35; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); text-align: center; font-weight: 600; }
.btn.chosen { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.btn.right { border-color: var(--good); } .btn.wrong { border-color: var(--bad); }
.btn:disabled { cursor: default; }
.row { display: flex; gap: 8px; } .row .btn { width: auto; flex: 1; text-align: center; padding: 12px 6px; font-size: 15px; }
.verdict { font-family: var(--serif); font-size: 22px; margin: 6px 0 2px; } .verdict.good { color: var(--good); } .verdict.bad { color: var(--bad); }
.page { border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; margin: 10px 0; background: var(--chip); }
.page h3:first-child { margin-top: 2px; }
.when { font-size: 13px; color: var(--ink2); letter-spacing: .04em; text-transform: uppercase; margin-bottom: 6px; }
textarea { width: 100%; min-height: 140px; font: 13px/1.4 ui-monospace, Menlo, monospace; color: var(--ink); background: var(--chip); border: 1px solid var(--rule); border-radius: 8px; padding: 10px; }
input[type=text] { font: inherit; width: 100%; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); color: var(--ink); }
.fade { animation: fade .25s ease-out; } @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.tally { display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; font-size: 15px; } .tally b { font-size: 20px; font-family: var(--serif); }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const ITEMS = /*__ITEMS__*/null;
const N = 24, PER_KIND = 6; // items a sitting, and the most of one kind of situation in it (a quarter)
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const app = document.getElementById('app');
const show = html => { app.innerHTML = `<div class="fade">${html}</div>`; window.scrollTo(0, 0); };
const bar = (l, r) => `<div class="bar"><span>${l}</span><span>${r}</span></div>`;
// A small deterministic random stream from the tester's code, so a sitting can be rebuilt from the code alone.
function rng(seed) { let s = 0; for (const c of seed) s = (s * 31 + c.charCodeAt(0)) >>> 0; return () => { s = (s + 0x6d2b79f5) >>> 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const code = () => Array.from({ length: 6 }, () => 'abcdefghjkmnpqrstuvwxyz23456789'[Math.floor(Math.random() * 31)]).join('');
let S; // the sitting
// Draw a sitting: N items, no kind over PER_KIND, no two items of one person adjacent, half with the page. Which half depends on the code,
// so across testers every item is seen both ways about equally.
function draw(tester) {
  const r = rng(tester);
  const pool = ITEMS.slice().sort(() => r() - 0.5);
  const picked = [], kinds = {};
  for (const it of pool) {
    if (picked.length >= N) break;
    if ((kinds[it.trigger] ?? 0) >= PER_KIND) continue;
    if (picked.some(p => p.person.name === it.person.name && p.seed === it.seed)) continue; // one item per person in a sitting
    kinds[it.trigger] = (kinds[it.trigger] ?? 0) + 1;
    picked.push(it);
  }
  const flip = r() < 0.5 ? 0 : 1;
  return picked.map((it, i) => ({ it, cond: (i + flip) % 2 === 0 ? 'page' : 'bare' }));
}
function start() {
  const tester = code();
  S = { tester, started: new Date().toISOString(), items: draw(tester), ix: 0, answers: [], score: { you: 0, town: 0, witness: 0 } };
  if (!S.items.length) { show('<div class="card"><p>No items were built into this page.</p></div>'); return; }
  show(`${bar('Reading the town', `your code ${tester}`)}
  <div class="card">
    <h1>Reading the town</h1>
    <p class="prose">A small town, and a witness who has lived there ten years and knows some of its people. You will be shown ${S.items.length} moments where it is not obvious what someone will do, and asked what they did.</p>
    <p class="prose">Sometimes you get what the witness knows about the person; sometimes only the situation. Either way you see what people in this town usually do in that spot. After each answer you see what happened and why.</p>
    <p class="small muted">About twenty minutes. There is nothing to study for. Your answers stay on this device until you copy them at the end and send them; nothing is sent by the page. Your code is ${tester}.</p>
    <button class="btn primary" onclick="item()">Begin</button>
  </div>`);
}
function personPage(it) {
  const p = it.person, g = it.page;
  return `<div class="page">
    <h3>What the witness knows about ${esc(p.first)}</h3>
    <p><b>${esc(p.name)}</b>, ${p.age}, ${esc(p.job)}${p.facts && p.facts.length ? ' · ' + esc(p.facts.join(', ')) : ''}. ${esc(p.how ?? '')}</p>
    ${g.sense && g.sense.length ? `<h3>The witness's sense of ${esc(p.first)}</h3><ul>${g.sense.map(s => `<li>${esc(s)}</li>`).join('')}</ul>` : ''}
    ${g.seems ? `<p class="small muted">${esc(g.seems)}</p>` : ''}
    ${g.seen && g.seen.length ? `<h3>What the witness has seen ${esc(p.first)} do</h3><ul>${g.seen.map(s => `<li>${esc(s)}</li>`).join('')}</ul>` : ''}
    ${g.known && g.known.length ? `<h3>Seen and heard</h3><ul class="small">${g.known.slice(-8).map(k => `<li><span class="muted">${k.year}</span> ${esc(k.text)}</li>`).join('')}</ul>` : ''}
    ${it.other ? `<h3>${esc(it.other.name)}, ${it.other.age}, ${esc(it.other.job)}</h3><p class="small">${esc(it.other.tie)}${it.other.feel && it.other.feel.length ? ' ' + esc(it.other.feel.join(' ')) : ''}</p>${it.other.between && it.other.between.length ? `<ul class="small">${it.other.between.slice(-4).map(k => `<li><span class="muted">${k.year}</span> ${esc(k.text)}</li>`).join('')}</ul>` : ''}` : ''}
  </div>`;
}
let t0, picked = null, conf = null;
function item() {
  const { it, cond } = S.items[S.ix]; picked = null; conf = null; t0 = Date.now();
  const other = it.other ? `<p class="small muted">${esc(it.other.name)}, ${it.other.age}, ${esc(it.other.job)}. ${esc(it.other.tie)}</p>` : '';
  show(`${bar(`${S.ix + 1} of ${S.items.length}`, cond === 'page' ? 'with the page' : 'situation only')}
  <div class="card">
    <div class="when">${esc(it.person.name)}, ${it.person.age}, ${esc(it.person.job)}</div>
    <p class="prose">${esc(it.question)}</p>
    ${other}
    ${it.town ? `<p class="small muted">${esc(it.town)}</p>` : ''}
    ${cond === 'page' ? personPage(it) : ''}
    <h3>What does ${esc(it.person.first)} do?</h3>
    <div id="opts">${it.options.map(o => `<button class="btn" data-opt="${esc(o.id)}" onclick="pick(this)">${esc(o.text)}</button>`).join('')}</div>
    <h3>How sure are you?</h3>
    <div class="row" id="conf">${['guessing', 'fairly sure', 'sure'].map(c => `<button class="btn" data-conf="${c}" onclick="sure(this)">${c}</button>`).join('')}</div>
    <button class="btn primary" id="lock" onclick="lock()" disabled>Lock in</button>
  </div>`);
}
function pick(b) { picked = b.dataset.opt; for (const x of document.querySelectorAll('#opts .btn')) x.classList.toggle('chosen', x === b); ready(); }
function sure(b) { conf = b.dataset.conf; for (const x of document.querySelectorAll('#conf .btn')) x.classList.toggle('chosen', x === b); ready(); }
function ready() { document.getElementById('lock').disabled = !(picked && conf); }
function lock() {
  const { it, cond } = S.items[S.ix];
  const ms = Date.now() - t0, right = picked === it.answer;
  const town = it.readers.base === it.answer, wit = it.readers.witness === it.answer;
  if (right) S.score.you++; if (town) S.score.town++; if (wit) S.score.witness++;
  S.answers.push({ id: it.id, cond, answer: picked, correct: right, conf, ms, position: it.options.findIndex(o => o.id === picked) });
  for (const x of document.querySelectorAll('#opts .btn, #conf .btn')) x.disabled = true;
  for (const x of document.querySelectorAll('#opts .btn')) { if (x.dataset.opt === it.answer) x.classList.add('right'); else if (x.dataset.opt === picked) x.classList.add('wrong'); }
  document.getElementById('lock').remove();
  document.getElementById('conf').insertAdjacentHTML('afterend', `<div class="fade">
    <p class="verdict ${right ? 'good' : 'bad'}">${right ? 'Right.' : 'Not this time.'}</p>
    <h3>What happened</h3><p class="prose">${esc(it.happened)}</p>
    ${it.why && it.why.length ? `<h3>Why, as the record has it</h3><ul>${it.why.map(w => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}
    <button class="btn primary" onclick="next()">${S.ix + 1 < S.items.length ? 'Next' : 'Finish'}</button></div>`);
}
function next() { S.ix++; if (S.ix < S.items.length) item(); else end(); }
function end() {
  const n = S.items.length;
  show(`${bar('The end', `your code ${S.tester}`)}
  <div class="card">
    <h1>${S.score.you} of ${n}</h1>
    <div class="tally"><span>You</span><b>${S.score.you}</b><span>The town's usual answer</span><b>${S.score.town}</b><span>The witness</span><b>${S.score.witness}</b></div>
    <p class="small muted">The witness is a reader inside the model that has watched these people for years. The town's usual answer is what most people here do in that spot.</p>
    <h3>Did the people feel like people?</h3>
    <div class="row" id="felt">${[1, 2, 3, 4, 5].map(k => `<button class="btn" data-k="${k}" onclick="felt(this)">${k}</button>`).join('')}</div>
    <p class="small muted">1 is "a list of acts", 5 is "I could tell you who they are".</p>
    <h3>One line, if you like</h3>
    <input type="text" id="note" maxlength="240" placeholder="Anything that struck you">
    <h3>Would you do another set of ${N}?</h3>
    <div class="row" id="again">${['yes', 'no'].map(k => `<button class="btn" data-k="${k}" onclick="again(this)">${k}</button>`).join('')}</div>
    <button class="btn primary" onclick="finish()">Show my answers to send</button>
  </div>`);
  S.felt = null; S.again = null;
}
function felt(b) { S.felt = +b.dataset.k; for (const x of document.querySelectorAll('#felt .btn')) x.classList.toggle('chosen', x === b); }
function again(b) { S.again = b.dataset.k; for (const x of document.querySelectorAll('#again .btn')) x.classList.toggle('chosen', x === b); }
function finish() {
  S.note = (document.getElementById('note') || {}).value || '';
  const out = { study: 'Q3', tester: S.tester, started: S.started, finished: new Date().toISOString(), items: S.answers, felt: S.felt, note: S.note, again: S.again, agent: navigator.userAgent.slice(0, 80) };
  const text = JSON.stringify(out);
  show(`${bar('Thank you', `your code ${S.tester}`)}
  <div class="card">
    <h2>Send this back</h2>
    <p>Copy the text below and send it to the person who gave you the link, or save it as a file and send that. It holds your answers and nothing else about you.</p>
    <textarea id="out" readonly>${esc(text)}</textarea>
    <button class="btn primary" onclick="copyOut()">Copy</button>
    <button class="btn" onclick="saveOut()">Save as a file</button>
    <p class="small muted" id="copied"></p>
  </div>`);
}
function copyOut() { const t = document.getElementById('out'); t.select(); try { navigator.clipboard.writeText(t.value); document.getElementById('copied').textContent = 'Copied.'; } catch (e) { document.execCommand('copy'); document.getElementById('copied').textContent = 'Copied.'; } }
function saveOut() { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([document.getElementById('out').value], { type: 'application/json' })); a.download = `reading-the-town-${S.tester}.json`; a.click(); }
window.__study = { draw, start, get S() { return S; } };
if (!ITEMS || !ITEMS.length) app.innerHTML = '<div class="card"><p>No items were built into this page.</p></div>'; else start();
</script>
</body>
</html>
